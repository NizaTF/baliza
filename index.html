    <script>
      (function () {
        try {
          var host = window.location.hostname || '';
          var isDevHost =
            host.indexOf('ais-dev-') === 0 ||
            host === 'localhost' ||
            host === '127.0.0.1';
          if (isDevHost && 'serviceWorker' in navigator) {
            var hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (!regs || regs.length === 0) return;
              Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
                if ('caches' in window) {
                  caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  }).finally(function () {
                    if (hadController && !sessionStorage.getItem('baliza_sw_cleaned')) {
                      sessionStorage.setItem('baliza_sw_cleaned', '1');
                      window.location.reload();
                    }
                  });
                } else if (hadController && !sessionStorage.getItem('baliza_sw_cleaned')) {
                  sessionStorage.setItem('baliza_sw_cleaned', '1');
                  window.location.reload();
                }
              });
            });
          }
        } catch (e) {}
      })();
    </script>
